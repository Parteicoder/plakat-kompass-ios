# Beschreibung des Xcode-Projekts für XcodeGen.
#
# Warum nicht einfach eine .xcodeproj einchecken: Die Datei ist ein generiertes Gebilde mit
# zufälligen Kennungen, das bei jeder Änderung riesige Diffs erzeugt und bei zwei Leuten
# zuverlässig Konflikte produziert. Diese 40 Zeilen sind lesbar und erzeugen sie:
#
#     brew install xcodegen
#     xcodegen generate
#     open PlakatKompass.xcodeproj
#
# Wer XcodeGen nicht will, legt in Xcode ein iOS-App-Projekt an, zieht App/ hinein, bindet das
# Package als lokale Abhängigkeit ein und übernimmt App/Info.plist. Diese Datei sagt, welche
# Einstellungen dabei nötig sind.

name: PlakatKompass

options:
  bundleIdPrefix: de.bsw
  # Muss mit der Zahl in Package.swift zusammenpassen. iOS 17 schliesst iPhone X, 8 und 8 Plus
  # aus - Geraete von 2017. Ab dem iPhone XS von 2018 laeuft alles.
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PlakatKompassCore:
    path: .

  # Google Nearby Connections als Swift-Paket. Damit gleicht das iPhone per Funk direkt mit der
  # Android-App ab, statt nur ueber eine verschickte Datei.
  #
  # AUF EINE REVISION FESTGENAGELT, nicht auf eine Fassung: Das Repo hat keinen brauchbaren Tag.
  # Der einzige ist v0.0.1-ios von November 2021 und liegt lange vor dem Swift-Paket. "branch:
  # main" waere die schlechtere Wahl - dann aenderte ein fremder Push den eigenen Bau, unbemerkt.
  #
  # BEWUSST NICHT IN Package.swift: Das Paket zieht abseil, BoringSSL, protobuf und den ganzen
  # C++-Kern von Nearby mit und uebersetzt sie aus dem Quelltext. Stuende es dort, muesste jedes
  # "swift build" und jedes "swift test" das mitbauen - fuer einen Kern, der davon kein Byte
  # benutzt. Der Funk-Abgleich ist Sache der App, nicht des geteilten Kerns.
  NearbyConnections:
    url: https://github.com/google/nearby
    revision: de5d309af13e1b929c22d0c97f9a401cef93c7b1

targets:
  PlakatKompass:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          # Die Plist wird ueber INFOPLIST_FILE eingebunden. Zusaetzlich als Ressource
          # mitzukopieren waere eine zweite, unbenutzte Fassung im fertigen Bundle.
          - "Info.plist"
          # Wird unten ausdruecklich als Ressource eingehaengt.
          - "PrivacyInfo.xcprivacy"
      # Das Datenschutz-Manifest MUSS im Bundle landen, sonst weist der App Store die App
      # zurueck. Ausdruecklich als Ressource, statt sich darauf zu verlassen, dass XcodeGen
      # eine unbekannte Endung richtig einsortiert - ein Manifest, das still nicht mitkommt,
      # faellt erst beim Einreichen auf.
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: PlakatKompassCore
        product: PlakatKompassCore
      - package: NearbyConnections
        product: NearbyConnections
    # Damit "xcodebuild test -scheme PlakatKompass" die Oberflaechentests mitnimmt. Ohne diesen
    # Block erzeugt XcodeGen zwar das Testziel, haengt es aber in kein Schema - der Lauf waere
    # gruen, ohne einen einzigen Test ausgefuehrt zu haben.
    scheme:
      testTargets:
        - PlakatKompassUITests
    # HIER STAND EIN "info:"-BLOCK. Er hat App/Info.plist ERZEUGT und damit die
    # eingecheckte Fassung ueberschrieben - mitsamt den Berechtigungstexten und den
    # Dateityp-Angaben. Auf dem Bau-Rechner blieb eine Plist mit zwei Eintraegen uebrig.
    #
    # Aufgefallen waere das erst auf einem echten iPhone, und zwar zweimal:
    # Ohne NSCameraUsageDescription stuerzt die App beim ersten Foto ab, statt zu fragen,
    # und ohne CFBundleDocumentTypes taucht sie nicht in "Oeffnen mit" auf - womit der
    # Abgleich zwischen Android und iOS gar nicht erst zustande kaeme.
    #
    # Der CI kann das nicht sehen: Eine unvollstaendige Info.plist ist kein Uebersetzungsfehler.
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        PRODUCT_BUNDLE_IDENTIFIER: de.bsw.plakatkompass
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"          # nur iPhone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Das BSW-Pink als App-Farbe. iOS faerbt damit Knoepfe, Schalter, Auswahlen und die
        # Navigationsleiste - ohne eine einzige Zeile Code und ueberall gleich. Ein .tint() im
        # Quelltext waere derselbe Effekt an einer Stelle, die man beim naechsten Umbau vergisst.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Signierung bleibt bewusst leer: Die Team-ID gehoert nicht ins Repo.
        # In Xcode unter "Signing & Capabilities" das eigene Team waehlen.
        CODE_SIGN_STYLE: Automatic

  # Oberflaechentests: startet die App und tippt sich durch die fuenf Reiter.
  #
  # Getrenntes Ziel, weil UI-Tests als eigener Vorgang NEBEN der App laufen - sie steuern sie
  # von aussen ueber die Barrierefreiheits-Schnittstelle. Ein Unit-Test-Ziel koennte das nicht.
  PlakatKompassUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: PlakatKompass
    settings:
      base:
        TEST_TARGET_NAME: PlakatKompass
        # Ohne eigene Bundle-Kennung kollidiert das Testpaket mit der App.
        PRODUCT_BUNDLE_IDENTIFIER: de.bsw.plakatkompass.uitests
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
