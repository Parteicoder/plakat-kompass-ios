# Beschreibung des Xcode-Projekts für XcodeGen.
#
# Warum nicht einfach eine .xcodeproj einchecken: Die Datei ist ein generiertes Gebilde mit
# zufälligen Kennungen, das bei jeder Änderung riesige Diffs erzeugt und bei zwei Leuten
# zuverlässig Konflikte produziert. Diese 40 Zeilen sind lesbar und erzeugen sie:
#
#     brew install xcodegen
#     xcodegen generate
#     open PlakatKompass.xcodeproj
#
# Wer XcodeGen nicht will, legt in Xcode ein iOS-App-Projekt an, zieht App/ hinein, bindet das
# Package als lokale Abhängigkeit ein und übernimmt App/Info.plist. Diese Datei sagt, welche
# Einstellungen dabei nötig sind.

name: PlakatKompass

options:
  bundleIdPrefix: de.bsw
  # Muss mit der Zahl in Package.swift zusammenpassen. iOS 17 schliesst iPhone X, 8 und 8 Plus
  # aus - Geraete von 2017. Ab dem iPhone XS von 2018 laeuft alles.
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PlakatKompassCore:
    path: .

targets:
  PlakatKompass:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          # Die Plist wird ueber INFOPLIST_FILE eingebunden. Zusaetzlich als Ressource
          # mitzukopieren waere eine zweite, unbenutzte Fassung im fertigen Bundle.
          - "Info.plist"
    dependencies:
      - package: PlakatKompassCore
        product: PlakatKompassCore
    # HIER STAND EIN "info:"-BLOCK. Er hat App/Info.plist ERZEUGT und damit die
    # eingecheckte Fassung ueberschrieben - mitsamt den Berechtigungstexten und den
    # Dateityp-Angaben. Auf dem Bau-Rechner blieb eine Plist mit zwei Eintraegen uebrig.
    #
    # Aufgefallen waere das erst auf einem echten iPhone, und zwar zweimal:
    # Ohne NSCameraUsageDescription stuerzt die App beim ersten Foto ab, statt zu fragen,
    # und ohne CFBundleDocumentTypes taucht sie nicht in "Oeffnen mit" auf - womit der
    # Abgleich zwischen Android und iOS gar nicht erst zustande kaeme.
    #
    # Der CI kann das nicht sehen: Eine unvollstaendige Info.plist ist kein Uebersetzungsfehler.
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        PRODUCT_BUNDLE_IDENTIFIER: de.bsw.plakatkompass
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"          # nur iPhone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Signierung bleibt bewusst leer: Die Team-ID gehoert nicht ins Repo.
        # In Xcode unter "Signing & Capabilities" das eigene Team waehlen.
        CODE_SIGN_STYLE: Automatic
