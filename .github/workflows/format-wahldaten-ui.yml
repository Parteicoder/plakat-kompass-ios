name: Einmalig Swift formatieren

on:
  push:
    branches:
      - agent/wahldaten-ui

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Geänderte Swift-Dateien formatieren
        shell: bash
        run: |
          git fetch origin main
          dateien=()
          while IFS= read -r -d '' datei; do
            dateien+=("$datei")
          done < <(git diff --name-only -z --diff-filter=ACMR origin/main HEAD -- '*.swift')
          swift format format --in-place --parallel "${dateien[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${dateien[@]}"
          if ! git diff --cached --quiet; then
            git commit -m "Swift-Dateien formatieren"
            git push
          fi
