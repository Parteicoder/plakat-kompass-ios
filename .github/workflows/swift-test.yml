name: Swift Test

# Uebersetzt den Kern, laesst die Tests laufen und baut die App.
#
# Braucht einen Mac. Daran fuehrt kein Weg vorbei: CryptoKit, UIKit und MapKit gibt es nur auf
# Apple-Plattformen, und iOS-Binaerdateien erzeugt ausschliesslich Xcode.
#
# Bei einem oeffentlichen Repo sind GitHubs Mac-Runner kostenlos - der zehnfache Faktor auf
# macOS-Minuten gilt nur fuer private Repos. Ein eigener Mac ist also nicht noetig.
#
# BEWUSST NICHT selbst gehostet: An einem oeffentlichen Repo kann jeder forken, einen Pull
# Request oeffnen und damit fremden Code auf dem eigenen Rechner ausfuehren lassen.
#
# macos-15 statt macos-14, weil dort Xcode 16 liegt. XcodeGen schreibt inzwischen Projekte im
# Format 77, das Xcode 15.4 auf macos-14 nicht oeffnen kann - der Lauf scheiterte daran mit
# "future Xcode project file format (77)".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: swift-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kern:
    name: Kern uebersetzen und testen
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode-Fassung anzeigen
        run: |
          xcodebuild -version
          swift --version

      - name: Kern uebersetzen
        run: swift build

      - name: Tests
        # Hier laufen die Kreuztests gegen den Testvektor: Der Kern muss ein Paket lesen
        # koennen, das weder von ihm noch von der Kotlin-Seite erzeugt wurde.
        run: swift test

      - name: Jede Abhaengigkeit steht auf der Lizenzseite
        # WARUM DIESE AUFGABE EXISTIERT: Genau dieser Fehler ist passiert. Der Funk-Abgleich
        # brachte Google Nearby in die App - und die Lizenzseite nannte monatelang weiter nur
        # ZIPFoundation. Namensnennung, die fehlt, ist bei einer AGPL-App kein Schoenheits-
        # fehler, sondern ein Lizenzverstoss. Und er faellt von selbst nie auf: Die App baut,
        # startet und laeuft einwandfrei ohne die Nennung.
        #
        # Geprueft wird die schwache, aber wartungsfreie Richtung: Jedes Paket, das in
        # Package.swift oder project.yml als Abhaengigkeit steht, muss auf der Lizenzseite
        # namentlich vorkommen. Was Nearby SEINERSEITS mitbringt, steht hier nicht - das
        # nennt kein Manifest dieses Projekts. Diese sechs sind in EinstellungenView.swift
        # aus Package.swift und .gitmodules von google/nearby abgeschrieben und dort als
        # eigener Abschnitt begruendet.
        run: |
          seite=App/EinstellungenView.swift
          fehlt=0
          # Paketnamen aus beiden Manifesten: "url: .../nearby" -> nearby,
          # ".package(url:" in Package.swift genauso. Der letzte Pfadteil ohne .git.
          pakete=$(grep -hoE 'https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+' \
                     Package.swift project.yml 2>/dev/null \
                   | sed 's|.*/||; s|\.git$||' | sort -u)
          echo "Abhaengigkeiten laut Manifest:"; echo "${pakete:-(keine)}" | sed 's/^/  /'
          echo
          for paket in $pakete; do
            # Ohne -i waere "ZIPFoundation" gegen "zipfoundation" blind, ohne den Wortstamm
            # scheiterte "nearby" an "Nearby Connections". Deshalb Teilstring, klein.
            if grep -qi "$paket" "$seite"; then
              echo "genannt         $paket"
            else
              echo "NICHT GENANNT:  $paket fehlt in $seite"
              fehlt=1
            fi
          done
          exit $fehlt

  app:
    name: iOS-App bauen
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bauzwischenstaende aus dem letzten Lauf holen
        # DER GROSSE HEBEL. Der Bau hat zehn Minuten gedauert, und fast alles davon war
        # Nearby: abseil, BoringSSL, protobuf und der C++-Kern kommen als QUELLTEXT und wurden
        # bei jedem Lauf von vorn uebersetzt. Dieser Quelltext aendert sich aber nur, wenn die
        # in project.yml festgenagelte Revision sich aendert - also praktisch nie.
        #
        # ZUM SCHLUESSEL: Der exakte Schluessel trifft absichtlich NIE, weil die Commit-Kennung
        # darin steht. Gewollt ist der restore-key: Er greift auf den neuesten Zwischenstand mit
        # DERSELBEN Abhaengigkeitslage zurueck. Xcode uebersetzt dann nur, was sich geaendert hat
        # - unseren Swift-Code - und laesst die C++-Objektdateien liegen. Aendert jemand
        # project.yml oder Package.swift, faellt der Praefix weg und alles wird neu gebaut. Genau
        # so soll es sein: Ein zwischengespeicherter Bau, der nicht zum Manifest passt, waere
        # schlimmer als ein langsamer.
        #
        # Eingepackt wird nur build/Build und build/SourcePackages. Ausdruecklich NICHT
        # build/Index.noindex: Der Index ist fuer die Codevervollstaendigung in Xcode da, im CI
        # sieht ihn niemand an, und er ist der groesste Brocken. Er entsteht durch
        # COMPILER_INDEX_STORE_ENABLE=NO unten gar nicht erst.
        uses: actions/cache@v4
        with:
          path: |
            build/Build
            build/SourcePackages
          key: bau-${{ runner.os }}-${{ hashFiles('project.yml', 'Package.swift') }}-${{ github.sha }}
          restore-keys: |
            bau-${{ runner.os }}-${{ hashFiles('project.yml', 'Package.swift') }}-

      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: App bauen, ohne Signierung
        # CODE_SIGNING_ALLOWED=NO, weil im CI kein Entwicklerzertifikat liegt und auch keines
        # hingehoert. Zum Uebersetzen wird es nicht gebraucht, nur zum Installieren.
        #
        # Dieser Schritt dauert seit dem Funk-Abgleich deutlich laenger: Nearby Connections bringt
        # abseil, BoringSSL, protobuf und seinen C++-Kern als Quelltext mit, und das alles wird
        # hier uebersetzt. Das ist kein haengender Lauf, sondern die Rechnung fuer eine
        # Schnittstelle, die es nur so gibt.
        timeout-minutes: 120
        run: |
          xcodebuild build \
            -project PlakatKompass.xcodeproj \
            -scheme PlakatKompass \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Simulator vorbereiten
        # HIER STAND EIN VOLLSTAENDIGER STARTVERSUCH: installieren, starten, acht Sekunden
        # warten, nachsehen ob der Vorgang noch da ist. Er hat zweieinhalb Minuten gekostet und
        # war zu seiner Zeit richtig - damals gab es keine Oberflaechentests, und ein Absturz
        # beim Start waere sonst durchgerutscht.
        #
        # Inzwischen gibt es sie, und sie beweisen STRENG MEHR: Der erste Test startet die App
        # ebenfalls und verlangt danach, dass sich alle fuenf Bereiche zeichnen. Stirbt die App
        # beim Start, scheitert er sofort mit "Application is not running". Zweimal dieselbe
        # Aussage einzuholen ist keine doppelte Sicherheit, sondern doppelte Wartezeit.
        #
        # Geblieben ist, was der Testlauf NICHT mitbringt: die Wahl des Geraets und der
        # Absturzbericht. Der wird jetzt NACH den Tests gelesen - dort deckt er mehr ab als
        # vorher, naemlich auch Abstuerze mitten im Durchlauf.
        timeout-minutes: 20
        run: |
          set -uo pipefail
          # Irgendein verfuegbares iPhone. Der Name wird NICHT fest verdrahtet - welche Geraete
          # ein Runner-Abbild mitbringt, aendert Apple ohne Ansage, und ein fest eingetragenes
          # "iPhone 16" laesst den Lauf eines Tages ohne Grund scheitern.
          UDID=$(xcrun simctl list devices available | grep 'iPhone' | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then echo "Kein iPhone-Simulator verfuegbar."; exit 1; fi
          echo "Simulator: $UDID"
          # Der naechste Schritt braucht dasselbe Geraet. Shell-Variablen ueberleben den
          # Schrittwechsel nicht, GITHUB_ENV schon.
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

          # Vorab hochfahren, damit "simctl privacy" im naechsten Schritt ein laufendes Geraet
          # vorfindet und der Testlauf nicht selbst darauf warten muss.
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          # Die App muss installiert sein, bevor ihr etwas erlaubt werden kann.
          APP=$(find build/Build/Products -maxdepth 2 -name 'PlakatKompass.app' -type d | head -1)
          if [ -z "$APP" ]; then echo "Kein gebautes App-Buendel gefunden."; exit 1; fi
          xcrun simctl install "$UDID" "$APP"
          echo "Installiert: $APP"

      - name: Oberflaeche im Simulator pruefen
        # Eine Stufe ueber dem Start: Zeichnet sich jeder der fuenf Bereiche ueberhaupt?
        #
        # Der Schritt davor beweist, dass die App nicht beim Start aussteigt - und mehr nicht.
        # Vier von fuenf Bereichen bekommt man dabei gar nicht zu sehen. Ein Absturz beim
        # Wechsel auf die Karte, eine Aktualisierungsschleife in der Liste oder ein
        # @EnvironmentObject, das nur einem Bildschirm fehlt, ueberlebt einen reinen
        # Startversuch muehelos.
        #
        # Geprueft wird je Bereich nur, dass sein Titel in der Navigationsleiste erscheint. Das
        # ist absichtlich wenig: Der Titel steht erst da, wenn SwiftUI die Ansicht wirklich
        # gebaut hat. Kleinste Aussage, die einen leeren oder abgestuerzten Bildschirm
        # ausschliesst - und sie braucht keine Testdaten.
        timeout-minutes: 40
        run: |
          # ORTUNG VORAB ERLAUBEN, damit der Dialog gar nicht erst kommt.
          #
          # Der Lauf ist einmal daran gescheitert, dass zwei Systemdialoge nacheinander
          # aufgingen: "exists" sagte ja zum Ortungsdialog, und bis der Tipp beim Element war,
          # stand dort schon der Meldungsdialog mit nur zwei Knoepfen. Ein Dialog, den es nie
          # gibt, kann auch nicht zum falschen Zeitpunkt verschwinden - das ist die einzige
          # Loesung, die das Rennen wirklich beendet statt es zu verkuerzen.
          #
          # Fuer Meldungen gibt es kein Gegenstueck: "simctl privacy" kennt Ortung, Fotos,
          # Mikrofon und einiges mehr, aber keine Benachrichtigungen. Diesen einen Dialog muss
          # der Test weiter selbst wegklicken, jetzt aber als einzigen.
          #
          # "|| true", weil ein unbekannter Dienst je nach Xcode-Fassung einen Fehler wirft -
          # und der Schritt laeuft unter "bash -e". Daran soll kein Lauf scheitern.
          xcrun simctl privacy "$SIM_UDID" grant location-always de.bsw.plakatkompass || true
          xcrun simctl privacy "$SIM_UDID" grant location de.bsw.plakatkompass || true

          xcodebuild test \
            -project PlakatKompass.xcodeproj \
            -scheme PlakatKompass \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build \
            -only-testing:PlakatKompassUITests \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Absturzberichte und Meldungen der App
        # Laeuft AUCH, wenn die Tests gescheitert sind - dann wird er erst richtig interessant.
        # Ein Absturz mitten im Durchlauf zeigt sich hier als Bericht, waehrend die Testmeldung
        # nur sagt, dass ein Knopf nicht gefunden wurde.
        #
        # Er lag frueher VOR den Tests und sah deshalb nur den Start. Jetzt deckt er den
        # gesamten Durchlauf ab.
        if: always()
        run: |
          set -uo pipefail
          # ":-" ist Pflicht, nicht Vorsicht: Bei "always()" laeuft der Schritt auch dann, wenn
          # "Simulator vorbereiten" vorher ausgestiegen ist und SIM_UDID nie gesetzt wurde -
          # mit "set -u" waere das ein Abbruch an der falschen Stelle.
          GERAET="${SIM_UDID:-}"
          if [ -z "$GERAET" ]; then
            echo "Kein Simulator ausgewaehlt - es gibt nichts nachzusehen."
            exit 0
          fi
          echo "--- Meldungen der App ---"
          xcrun simctl spawn "$GERAET" log show --last 5m \
            --predicate 'process == "PlakatKompass"' --style compact 2>/dev/null | tail -40 || true

          BERICHTE=$(find ~/Library/Logs/DiagnosticReports -name 'PlakatKompass*' 2>/dev/null || true)
          if [ -n "$BERICHTE" ]; then
            echo "ABSTURZBERICHT gefunden:"
            for b in $BERICHTE; do echo "--- $b"; head -40 "$b"; done
            exit 1
          fi
          echo "Kein Absturzbericht."
          xcrun simctl shutdown "$GERAET" || true

      - name: Info.plist der gebauten App pruefen
        # Geprueft wird die Plist IM FERTIGEN BUNDLE, nicht die im Repo. Genau das war der
        # Fehler, den dieser Schritt abfaengt: In project.yml stand ein "info:"-Block, der
        # App/Info.plist beim Erzeugen ueberschrieb. Im Repo sah alles richtig aus, in der
        # gebauten App fehlte alles.
        #
        # Nichts davon ist ein Uebersetzungsfehler. Ohne diesen Schritt faellt es erst auf
        # einem echten iPhone auf - beim Absturz vor der ersten Kamerafrage, oder wenn die
        # App nicht in "Oeffnen mit" auftaucht und der Abgleich mit Android nicht zustande
        # kommt.
        run: |
          # Das Muster muss auf den GANZEN Pfad passen und Info.plist direkt in
          # PlakatKompass.app verlangen. Ein blosses "-name Info.plist -path '*PlakatKompass.app*'"
          # trifft auch die Plists der eingebetteten Ressourcenbuendel - beim ersten Lauf hier
          # ZIPFoundation_ZIPFoundation.bundle/Info.plist, in der die gesuchten Schluessel
          # natuerlich fehlen. Der Schritt schlug fehl, obwohl die App in Ordnung war.
          PLIST=$(find build/Build/Products -path '*/PlakatKompass.app/Info.plist')
          if [ "$(echo "$PLIST" | grep -c .)" -ne 1 ]; then
            echo "Erwartet wurde genau eine Info.plist, gefunden:"
            echo "$PLIST"
            exit 1
          fi
          echo "Geprueft wird: $PLIST"

          fehlt=0
          for schluessel in NSCameraUsageDescription NSLocationWhenInUseUsageDescription \
                            NSLocationAlwaysAndWhenInUseUsageDescription NSPhotoLibraryUsageDescription \
                            NSLocalNetworkUsageDescription NSBonjourServices \
                            CFBundleDocumentTypes UTImportedTypeDeclarations \
                            UIBackgroundModes CFBundleDisplayName; do
            if ! /usr/libexec/PlistBuddy -c "Print :$schluessel" "$PLIST" >/dev/null 2>&1; then
              echo "FEHLT: $schluessel"
              fehlt=1
            else
              echo "vorhanden: $schluessel"
            fi
          done

          # Der Bonjour-Typ muss WOERTLICH stimmen. NearbyDienstTests prueft, dass die Ableitung
          # aus der Dienstkennung genau diesen Wert ergibt (gegengeprueft an Googles eigenem
          # Beispiel); hier wird geprueft, dass er auch in der gebauten App steht. Erst beides
          # zusammen schliesst die Luecke - der Test allein sagt nichts ueber die Plist, und die
          # Plist allein sagt nichts darueber, ob der Wert der richtige ist.
          #
          # Weicht er ab, sucht iOS nach einem Typ, den es nicht freigegeben bekommt: keine
          # Fehlermeldung, kein Log, nur nie ein gefundenes Geraet.
          erwartet="_EA0A851F84A0._tcp"
          gefunden=$(/usr/libexec/PlistBuddy -c "Print :NSBonjourServices:0" "$PLIST" 2>/dev/null || true)
          if [ "$gefunden" = "$erwartet" ]; then
            echo "Bonjour-Typ stimmt: $gefunden"
          else
            echo "FALSCHER Bonjour-Typ: '$gefunden' statt '$erwartet'"
            fehlt=1
          fi

          # Das Datenschutz-Manifest muss neben der Info.plist im Bundle liegen. Fehlt es,
          # weist der App Store die App zurueck - und zwar erst beim Einreichen, nicht hier.
          if [ -f "$(dirname "$PLIST")/PrivacyInfo.xcprivacy" ]; then
            echo "vorhanden: PrivacyInfo.xcprivacy"
          else
            echo "FEHLT: PrivacyInfo.xcprivacy"
            fehlt=1
          fi

          exit $fehlt

      - name: Begruendungspflichtige Schnittstellen im Binaergebilde suchen
        # Apple verlangt, dass das Datenschutz-Manifest jede benutzte "required reason API"
        # nennt, und prueft das beim Einreichen am BINAERGEBILDE - nicht am Quelltext. Darin
        # steckt seit dem Funk-Abgleich auch alles, was Nearby Connections, abseil, BoringSSL
        # und protobuf mitbringen. Den eigenen Quelltext zu lesen reicht deshalb nicht mehr,
        # und Nearby bringt kein eigenes Manifest mit, das die Luecke fuellen wuerde.
        #
        # Das hier ist Apples Pruefung NACHGEBAUT, nicht Apples Pruefung selbst: nm fuer die
        # C-Funktionen, otool fuer die eindeutigen Objective-C-Selektoren. Es kann zu viel
        # finden - ein Symbol kann im Binaergebilde stehen, ohne je aufgerufen zu werden.
        # Genau diese Richtung ist aber die ungefaehrliche: Apple weist zurueck, wenn etwas
        # BENUTZT und nicht genannt ist. Was hier auftaucht, gehoert also ins Manifest.
        #
        # WAS DIESE PRUEFUNG NICHT SEHEN KANN, und das ist keine Nachlaessigkeit, sondern eine
        # Grenze der Methode: Sie findet nur DIREKTE Referenzen. Was ein Systemframework fuer
        # die App erledigt, steht nicht im Programm. @AppStorage ist genau so ein Fall - der
        # Zugriff auf UserDefaults passiert in SwiftUI, nicht hier, und deshalb meldet die
        # Suche fuer UserDefaults nichts, obwohl die App es benutzt und im Manifest nennt.
        #
        # Daraus folgt die Arbeitsteilung: Fuer den eigenen Swift-Code ist der Quelltext
        # massgeblich (dort steht jedes @AppStorage). Fuer die mitgebrachten C- und
        # C++-Bibliotheken ist DIESE Suche massgeblich, denn deren Quelltext liegt nicht im
        # Repo, und sie rufen libc direkt auf - da ist ein undefiniertes Symbol der Beweis.
        #
        # Mehrdeutige Selektoren wie "creationDate" oder "modificationDate" sind bewusst NICHT
        # dabei. Die stehen in jedem Foundation-nahen Programm und wuerden zu einem Eintrag
        # fuehren, den die App nicht braucht - und etwas zu nennen, das man nicht benutzt,
        # faellt beim Pruefen genauso auf wie etwas zu verschweigen.
        run: |
          set -uo pipefail
          BIN=$(find build/Build/Products -path '*/PlakatKompass.app/PlakatKompass' -type f)
          if [ "$(echo "$BIN" | grep -c .)" -ne 1 ]; then
            echo "Erwartet wurde genau ein Programm, gefunden:"; echo "$BIN"; exit 1
          fi
          echo "Untersucht wird: $BIN"

          # dyld_info ZUERST, nicht nm. Xcode schreibt seit Fassung 14 "chained fixups": Die
          # importierten Symbole stehen dann nicht mehr dort, wo "nm -u" nachsieht. Ein erster
          # Anlauf mit nm allein meldete deshalb fuer JEDE Kategorie "nichts gefunden" - ein
          # gruener Haken, der nur bewies, dass das Werkzeug nichts sah. nm bleibt als zweite
          # Quelle dabei, es kostet nichts und faengt aeltere Formate mit ab.
          symbole=$( { dyld_info -imports "$BIN"; nm -u "$BIN"; \
                       otool -v -s __TEXT __objc_methname "$BIN"; } 2>/dev/null )

          # Ohne diese Probe waere ein leeres oder unlesbares Ergebnis nicht von "nichts
          # gefunden" zu unterscheiden - und die Aufgabe wuerde gruen, gerade weil sie blind
          # ist. Genau so ist der erste Anlauf aufgeflogen, statt still durchzugehen.
          #
          # Die Probe ist "malloc", nicht "objc_msgSend". Auf objc_msgSend hatte ich zuerst
          # gesetzt, und die Probe schlug an - zu Recht, aber aus dem falschen Grund: Eine reine
          # Swift/SwiftUI-App ruft die Frameworks nativ auf und importiert objc_msgSend
          # womoeglich gar nicht. Ein Kontrollsymbol, das fehlen DARF, taugt nicht als Kontrolle.
          # malloc importiert jedes Programm, das gegen libSystem gebunden ist.
          if printf '%s\n' "$symbole" | grep -qE "(^|[^A-Za-z0-9_])_?(malloc|free)([^A-Za-z0-9_]|\$)"; then
            echo "Probe bestanden: $(printf '%s\n' "$symbole" | grep -c .) Zeilen Symbole und Selektoren."
          else
            echo "WARNUNG: Die Suche findet nicht einmal malloc - sie sieht offenbar nichts."
            echo "Ein 'keine Referenz' weiter unten ist dann WERTLOS und beweist gar nichts."
            echo "Zum Nachsehen die ersten Zeilen dessen, was die Werkzeuge geliefert haben:"
            printf '%s\n' "$symbole" | head -40 | sed 's/^/  | /'
            echo "  (insgesamt $(printf '%s\n' "$symbole" | grep -c .) Zeilen)"
            # Bewusst KEIN Abbruch mehr. Zweimal ist der Lauf hier gescheitert, weil das
            # WERKZEUG nicht taugte, nicht weil am Programm etwas falsch waere - und einen Bau
            # an einer Diagnose scheitern zu lassen, hilft niemandem. Die Aussage steht im Log
            # und im Manifest: Fuer die C/C++-Bibliotheken ist die verbindliche Pruefung Apples
            # eigene beim Hochladen. Was unten NOCH scheitert, ist der Fall, der wirklich zaehlt:
            # etwas gefunden UND nicht genannt.
          fi

          gefunden=""
          # Die Muster stehen OHNE fuehrenden Unterstrich. Je nach Werkzeug steht er da oder
          # nicht (dyld_info und nm schreiben "_stat", die Selektorentabelle "systemUptime"),
          # deshalb ist er im Ausdruck optional. Die Grenzen links und rechts muessen sein:
          # ohne sie faende "stat" auch jedes "fstatfs" und die Kategorien liefen ineinander.
          pruefe() {
            kategorie=$1; shift
            treffer=""
            for muster in "$@"; do
              if printf '%s\n' "$symbole" \
                 | grep -qE "(^|[^A-Za-z0-9_])_?${muster}([^A-Za-z0-9_]|\$)"; then
                treffer="$treffer $muster"
              fi
            done
            if [ -n "$treffer" ]; then
              echo "DIREKT BENUTZT      $kategorie -$treffer"
              gefunden="$gefunden $kategorie"
            else
              echo "keine Referenz      $kategorie"
            fi
          }

          pruefe NSPrivacyAccessedAPICategoryFileTimestamp \
            stat stat64 fstat fstat64 lstat lstat64 fstatat fstatat64 \
            getattrlist fgetattrlist getattrlistbulk getattrlistat \
            NSURLContentModificationDateKey NSURLCreationDateKey
          pruefe NSPrivacyAccessedAPICategorySystemBootTime \
            mach_absolute_time systemUptime
          pruefe NSPrivacyAccessedAPICategoryDiskSpace \
            statfs statfs64 fstatfs fstatfs64 statvfs fstatvfs \
            NSFileSystemFreeSize NSFileSystemSize \
            NSURLVolumeAvailableCapacityKey NSURLVolumeTotalCapacityKey \
            NSURLVolumeAvailableCapacityForImportantUsageKey \
            NSURLVolumeAvailableCapacityForOpportunisticUsageKey \
            systemFreeSize systemSize
          pruefe NSPrivacyAccessedAPICategoryActiveKeyboards activeInputModes
          pruefe NSPrivacyAccessedAPICategoryUserDefaults \
            NSUserDefaults standardUserDefaults

          echo
          echo "Hinweis: 'keine Referenz' heisst NICHT 'wird nicht benutzt'. Es heisst, dass das"
          echo "Programm die Schnittstelle nicht selbst aufruft. UserDefaults ist der Beleg:"
          echo "Es steht zu Recht im Manifest (jedes @AppStorage), taucht hier aber nicht auf,"
          echo "weil SwiftUI den Zugriff uebernimmt. Fuer eigenen Swift-Code gilt der Quelltext."
          echo

          deklariert=$(/usr/libexec/PlistBuddy -c "Print :NSPrivacyAccessedAPITypes" \
            App/PrivacyInfo.xcprivacy 2>/dev/null | grep -o 'NSPrivacyAccessedAPICategory[A-Za-z]*' || true)
          echo "Im Manifest genannt:"; echo "${deklariert:-(nichts)}" | sed 's/^/  /'

          fehlt=0
          for kategorie in $gefunden; do
            if printf '%s\n' "$deklariert" | grep -qx "$kategorie"; then
              echo "genannt   $kategorie"
            else
              echo "NICHT GENANNT: $kategorie gehoert in App/PrivacyInfo.xcprivacy"
              fehlt=1
            fi
          done
          exit $fehlt
